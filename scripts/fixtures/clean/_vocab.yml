# Fixture vocabulary - the vault's own _vocab.yml, trimmed to the subjects this
# fixture takes a position on. A real vault seeds this from the skill's
# vocabulary.yml reference and extends it per engagement, which is why the lint
# reads this file and never the shipped one.

terms:

  timing-window:
    definition: The shift that makes this product possible or necessary now, and how long
      the window it opens stays open. The mechanism, not the narrative.
    aliases:
      - why-now
      - market-timing
      - timing
      - window
    required: true

  price-anchor:
    definition: The price point the plan recommends, per unit and cadence. What the product
      charges. What the segment demonstrably pays is a separate position.
    aliases:
      - price
      - pricing
      - price-point
      - list-price
    required: true

  primary-risk:
    definition: The highest-ranked way this product dies, with the leading indicator that
      would show it happening. Singular deliberately - a set-valued subject collides with
      itself and buries the real conflicts under false ones.
    aliases:
      - top-risk
      - key-risk
      - main-risk
    required: true

  market-growth:
    definition: Whether the market is compounding, flat or shrinking, and the driver behind
      it. Not required, because a plan can be sound against a flat market it has correctly
      sized.
    aliases:
      - growth-rate
      - market-trajectory
    required: false

  steady-state-ceiling:
    definition: The equilibrium the modelled configuration converges on, stated against the
      founder's stated goal with every input labelled structural or policy. Required, and
      carried here by a claim holding none of the five verdict fields - the ceiling half of
      the asymmetry, where field presence is what triggers the set.
    aliases:
      - ceiling
      - steady-state
      - equilibrium
    required: true

  target-verdict:
    definition: Whether the founder's stated target is reached by the stated date, with the
      driver that binds named and that driver's kind recorded. Not required, because a plan
      owes a verdict only where a target was stated - and a term this release introduces, so
      the four fields a verdict owes outright are owed whatever the note carries.
    aliases:
      - target-feasibility
      - goal-verdict
    required: false
