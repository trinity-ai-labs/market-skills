name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every check here is sub-second, so a superseded run has nothing to finish and
# no reason to hold a runner. Without this, three quick pushes to a PR branch
# burn three full runs to completion for one useful answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One runner, one checkout. The whole suite is well under two seconds of real
  # work, so a job per check would spend two minutes of runner time on spin-up
  # and cloning to answer in one. `if: always()` on every step after the first
  # keeps the one property a job split gives for free: a red PR reports every
  # failure it has, not just the first.
  #
  # The matrix adds macos-latest because bin/vault-lint.sh ships to users on
  # both platforms and Linux CI can't catch a macOS-only shell divergence (BSD
  # vs GNU awk/grep/sed, no bash-only leaks in a POSIX-sh script) before a
  # user's machine does. windows-latest is the other half of the port:
  # bin/vault-lint.ps1 exists for a session with no POSIX shell at all, and this
  # image carries one anyway (Git for Windows' Git Bash) - several steps below
  # run under it explicitly, a dependency worth stating since it is not this
  # repo's own tooling. version-bump below stays single-OS: it diffs git
  # history and the manifest, and a second OS proves nothing there.
  checks:
    name: gate, shipped tooling, public-repo hygiene
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash is already the default on ubuntu/macos runners; stating it here is
    # what makes windows-latest use Git for Windows' Git Bash too, instead of
    # its own default of pwsh, which cannot parse the `[ ... ]`/heredoc syntax
    # several steps below use. One place to say this, rather than repeating
    # `shell: bash` on every step that needs it and silently missing the next
    # one that's added.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: A core.autocrlf=true checkout still runs bin/vault-lint.sh
        if: always() && matrix.os == 'windows-latest'
        # Git for Windows installs default to core.autocrlf=true, which rewrites
        # a checked-out text file's LF to CRLF unless .gitattributes says
        # otherwise — the shebang becomes `#!/bin/sh\r` and the script dies with
        # "bad interpreter" before any Windows-specific behaviour is even
        # reachable. .gitattributes pins *.sh (and *.ps1) to `eol=lf` for
        # exactly that reason, but the checkout above ran under whatever
        # autocrlf this runner happens to default to, which proves nothing about
        # a user who installed Git for Windows with ITS recommended default. So
        # this clones fresh with autocrlf forced on and checks the result
        # directly — no carriage return in the shebang, and the script actually
        # runs — rather than trusting that .gitattributes merely exists.
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/autocrlf-check"
          git clone --quiet --config core.autocrlf=true . "$RUNNER_TEMP/autocrlf-check"
          cd "$RUNNER_TEMP/autocrlf-check"
          [ "$(git config --local core.autocrlf)" = "true" ] ||
            { echo "::error::core.autocrlf=true did not take effect on this clone — the check below would not be testing anything"; exit 1; }
          first_line=$(head -n 1 bin/vault-lint.sh)
          case "$first_line" in
            *"$(printf '\r')")
              echo "::error::bin/vault-lint.sh checks out with a CRLF shebang under core.autocrlf=true — .gitattributes did not hold"
              exit 1 ;;
          esac
          sh bin/vault-lint.sh --help >/dev/null
          echo "core.autocrlf=true checkout runs bin/vault-lint.sh cleanly"

      - name: The repo gate — structure, frontmatter, every reference resolves
        # scripts/check.mjs is the same command a contributor runs before opening
        # a PR (.agents/worktree.json declares it as both gate and scopedCheck).
        # CI runs the contributor's own check rather than a second, drifting copy.
        run: node scripts/check.mjs

      - name: The shipped lint's own suite
        if: always()
        # vault-lint.sh ships to users and runs against their private corpus. Its
        # regressions are invisible from outside — a check that stops firing and a
        # check that was deleted look identical — so this suite is the only thing
        # standing between a silent parser change and a vault that lints clean
        # while broken. Running this on macos-latest too is the whole point of
        # the matrix above: it's the regression baseline the cross-platform port
        # in a later PR is measured against.
        run: sh scripts/fixtures/run-fixtures.sh

      - name: A VAULT_LINT wrapper that pins the port to the PowerShell Windows actually ships
        if: always() && matrix.os == 'windows-latest'
        # bin/vault-lint.ps1's shebang is `#!/usr/bin/env pwsh`, so invoking it
        # directly — which is what run-fixtures.sh does through "$LINT" — follows
        # PATH to whichever `pwsh` this runner finds first, and this image ships
        # PowerShell 7 on PATH ahead of the in-box Windows PowerShell 5.1 the port
        # is actually written for (see the file's own TARGET comment) and that a
        # Windows user actually has. A suite that only ever ran through 7 would
        # not catch a 5.1-only parse failure — the file bans ??, ?., the ternary
        # and -Parallel for exactly that reason — before a user's own machine
        # did. VAULT_LINT can only name one executable, so this thin wrapper is
        # what makes the fixture suite drive the port through powershell.exe
        # explicitly, bypassing the shebang's own PATH search. cygpath turns the
        # checkout's POSIX-style path into the Windows-style one powershell.exe —
        # a native Windows binary, not an MSYS one — needs.
        run: |
          set -eu
          winpath=$(cygpath -w "$PWD/bin/vault-lint.ps1")
          wrapper="$RUNNER_TEMP/vault-lint-ps1-winps51.sh"
          printf '#!/bin/sh\nexec powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%s" "$@"\n' "$winpath" >"$wrapper"
          chmod +x "$wrapper"
          echo "VAULT_LINT_WINPS51=$wrapper" >>"$GITHUB_ENV"

      - name: The shipped lint's own suite, against the port under Windows PowerShell 5.1
        if: always() && matrix.os == 'windows-latest'
        # The same 241 assertions "The shipped lint's own suite" above holds the
        # shell to — this is the first PR where every one of them can also run
        # against the PowerShell port, and the wrapper above is what makes this
        # run go through 5.1 rather than whatever pwsh happens to be on PATH.
        run: VAULT_LINT="$VAULT_LINT_WINPS51" sh scripts/fixtures/run-fixtures.sh

      - name: The two lint implementations answer the same thing, mode by mode
        if: always()
        # bin/vault-lint.ps1 is a SECOND implementation of the same 3,600-line
        # linter, for a Windows session with no POSIX shell to run the first one.
        # Two implementations that size drift silently — each keeps passing its
        # own reading of the fixtures while answering a real vault differently,
        # and the first person to notice is a user acting on a wrong answer. This
        # runs every mode over every fixture through both and diffs the answers,
        # so a divergence is a red PR rather than a Windows user's wrong result.
        # It exits 0 while scripts/parity/unported/ still names a mode, because a
        # gate that went red until the last port landed would be red on every
        # slice PR from now until then — the printed count is the progress report.
        run: node scripts/parity/parity.mjs

      - name: The unported allowlist has emptied out for good
        if: always() && matrix.os == 'ubuntu-latest'
        # scripts/parity/unported/<mode> marker files are what let the parity
        # gate above stay green (exit 0) while a mode is still unported — see its
        # own comment. That printed "M allowlisted" count is only a real
        # terminal state if something eventually forces it back to zero;
        # otherwise a slice could allowlist a mode forever and nobody has to act
        # on the number. This is that something: a non-empty directory here is a
        # hard failure. Git does not track empty directories, so once the LAST
        # marker file is removed the directory itself stops existing on a fresh
        # checkout — that is the done state, not a broken checkout, so a missing
        # directory is treated the same as an empty one rather than failing on
        # ENOENT. Pure repo-content inspection with no OS-dependent behaviour, so
        # one OS is exhaustive — same reasoning as the shellcheck step below.
        run: |
          set -eu
          if [ -d scripts/parity/unported ] && [ -n "$(ls -A scripts/parity/unported)" ]; then
            echo "::error::scripts/parity/unported/ still names a mode — the port is not done"
            ls -A scripts/parity/unported | sed 's/^/  /'
            exit 1
          fi
          echo "scripts/parity/unported/ is empty — every mode is ported"

      - name: Every shell script holds to the shell its shebang declares
        if: always() && matrix.os == 'ubuntu-latest'
        # bin/ runs on a user's machine, so a bashism there is a runtime failure
        # discovered at the moment of use. shellcheck reads the dialect from the
        # shebang, so this stays correct if a script ever legitimately needs bash
        # — the shebang is the contract, and this checks whatever it declares.
        # ubuntu-latest ships shellcheck preinstalled; macos-latest does not, and
        # installing it there would just re-run the same static dialect check a
        # second time — shellcheck reads source text, not platform behaviour, so
        # one OS is exhaustive and a matrix run buys nothing here.
        run: shellcheck -S warning bin/*.sh scripts/fixtures/*.sh

      - name: Skills invoke vault-lint bare, never by path
        if: always()
        # This is the invariant the scripts/ -> bin/ move exists to establish, and
        # prose alone does not hold it. A skill runs inside the USER's project
        # directory, so any path-prefixed invocation resolves against their tree
        # and fails at the moment of use — on their machine, never in CI and never
        # on the author's. bin/ is on PATH either way; bare is the only form that
        # resolves. Both extensions are checked — a Windows session reaches for
        # vault-lint.ps1 exactly as a POSIX one reaches for vault-lint.sh, and a
        # path-prefixed form of either fails the same way.
        run: |
          set -eu
          if grep -rnE '/vault-lint\.(sh|ps1)' skills --include='*.md'; then
            echo "::error::a path-prefixed vault-lint.sh or vault-lint.ps1 in skills/ — invoke it bare"
            exit 1
          fi
          echo "all invocations bare"

      - name: The org name and an author's home directory stay out of public skills
        if: always()
        # The skills are public and generic on purpose; the regression to catch is
        # a real username or the org name landing in one. Generic placeholders are
        # NOT that regression — `/Users/you/…` and `/Users/example/…` do real
        # explanatory work in orchestration.md and vault-migration.md, so the
        # allowlist is the placeholder WORD, anchored to the end of the path
        # segment. `/Users/dev-wynberg` fails; `/Users/you` passes. The allowlist
        # sits behind an already-matched leak, so an unanticipated placeholder
        # fails loudly on the PR that introduces it rather than passing silently.
        run: |
          set -eu
          scanned="$(find skills -name '*.md' | wc -l | tr -d '[:space:]')"
          [ "$scanned" -gt 0 ] || { echo "::error::no markdown under skills/ — this check scanned nothing"; exit 1; }
          placeholder='you|your-name|example|username|user|<[a-z-]*>'
          hits="$(grep -rnoiE 'trinity|/(Users|home)/[A-Za-z0-9._<>-]+' skills --include='*.md' \
                  | grep -viE ":/(users|home)/($placeholder)\$" || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" | sed 's/^/::error::identifier or real home path: /'
            exit 1
          fi
          echo "clean across $scanned files"

      - name: The manifest parses and carries what Claude Code needs
        if: always()
        # `claude plugin validate --strict` is the authoritative check and catches
        # things this cannot (unrecognized fields, schema drift), but it needs the
        # CLI installed. This covers the failure modes that break a published
        # plugin outright: unparseable JSON, a missing field, a `name` that does
        # not match the marketplace entry maintained in the claude-plugins repo,
        # a version the bump guard below cannot compare, and a bin/ entry
        # that lands on a user's PATH without its executable bit.
        run: |
          set -eu
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            # A checkout on Windows carries no POSIX executable bit to test — NTFS
            # has no such concept, so [ -x ... ] would prove nothing there rather
            # than proving the wrong thing. Both bin/*.sh and bin/*.ps1 ship mode
            # 100755 in the git tree, and that is what ubuntu-latest and
            # macos-latest below actually verify.
            echo "skipping the executable-bit check on Windows — see the comment above"
          else
            [ -x bin/vault-lint.sh ] || { echo "::error::bin/vault-lint.sh is not executable — a command-not-found mid-run"; exit 1; }
            [ -x bin/vault-lint.ps1 ] || { echo "::error::bin/vault-lint.ps1 is not executable — a command-not-found mid-run"; exit 1; }
          fi
          python3 - <<'PY'
          import json, pathlib, re, sys

          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          fail = [
              f"plugin.json: missing '{field}'"
              for field in ("name", "description", "author", "version", "license", "repository")
              if not plugin.get(field)
          ]
          if plugin.get("name") != "market":
              fail.append(
                  f"plugin.json: name is '{plugin.get('name')}', but the marketplace entry "
                  "in trinity-ai-labs/claude-plugins installs 'market'"
              )
          if not re.fullmatch(r'\d+\.\d+\.\d+', str(plugin.get("version", ""))):
              fail.append(f"plugin.json: version '{plugin.get('version')}' is not MAJOR.MINOR.PATCH")
          for problem in fail:
              print(f"::error::{problem}")
          sys.exit(1 if fail else 0)
          PY

  version-bump:
    name: shipped content changed ⇒ version bumped
    # Only the merge that actually SHIPS is gated on the version. A release is
    # built on an integration branch from several slice branches, and each slice
    # changes shipped content — so without this condition every slice PR demands
    # its own bump, and one release either carries five of them or shows four red
    # PRs. The observed consequence was worse than the noise: slices stopped being
    # opened as PRs at all and were merged into the integration branch as bare
    # merge commits, which on a public repo costs the per-slice diff, the review
    # record, and `--delete-branch` — merged branches then accumulate until
    # someone prunes them by hand.
    #
    # The `checks` job above deliberately still runs on EVERY pull request: the
    # gate, shellcheck, and the public-repo hygiene scans are exactly what a slice
    # PR is for. Only the bump is deferred to the boundary where an install can
    # actually see it.
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The one job that needs history: it diffs against the PR base and reads the
      # manifest as it was at that commit.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A shipped change must move the version forward
        # plugin.json sets `version`, so an installed plugin is PINNED to that
        # string — pushing new commits under an unchanged version ships nothing
        # while looking like it worked. This is the guard for that silent failure.
        #
        # The list below is what does NOT ship, not what does. An allowlist of
        # shipped paths fails OPEN: add a commands/ or agents/ directory — the
        # obvious next step for a plugin — and it is silently exempt, which is
        # exactly the failure this job exists to catch. Inverted, a new directory
        # requires a bump by default, and new contributor tooling costs one loud
        # CI failure and a one-line exemption.
        #
        # docs/ is exempt for the same reason: a design spec ships nothing to a
        # user by itself, so it must not demand a version bump on its own. It
        # earns one only when the implementation PR it describes lands alongside
        # it and changes something that does ship.
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"
          git rev-parse --verify "$base" >/dev/null 2>&1 || { echo "no base commit to compare (first commit) — skipping"; exit 0; }
          exempt='^(scripts/|\.github/|\.agents/|AGENTS\.md|CHANGELOG\.md|docs/|\.gitignore)'
          changed="$(git diff --name-only "$base" HEAD | grep -vE "$exempt" || true)"
          if [ -z "$changed" ]; then echo "nothing shipped changed — bump not required"; exit 0; fi
          # The base commit legitimately has no manifest on the PR that introduces
          # one, and `git show` exits 128 there. Kept OUT of a pipeline and given
          # its own `|| true`: under `pipefail` a failing `git show` upstream of a
          # successful `python3` fails the whole substitution, and `set -e` then
          # kills the job with git's 128 and no output at all. Reading it into a
          # variable first makes the "no manifest yet" case explicit instead.
          read_version='import json,sys; raw=sys.stdin.read(); print(json.loads(raw).get("version","") if raw.strip() else "")'
          base_manifest="$(git show "$base:.claude-plugin/plugin.json" 2>/dev/null || true)"
          was="$(printf '%s' "$base_manifest" | python3 -c "$read_version")"
          now="$(python3 -c "$read_version" < .claude-plugin/plugin.json)"
          echo "shipped content changed:"; echo "$changed" | sed 's/^/  /'
          echo "version: ${was:-<none>} -> $now"
          # Compared as numbers, not strings: a REGRESSION (a bad merge dropping
          # 1.1.0 back to 1.0.0) is not equality, so an inequality test waves it
          # through and every install pinned at the higher version goes blind.
          python3 - "$was" "$now" <<'PY'
          import sys
          def parse(v):
              return tuple(int(p) for p in v.split(".")) if v else ()
          was, now = parse(sys.argv[1]), parse(sys.argv[2])
          if now <= was:
              print(f"::error::Shipped content changed but the version did not move forward "
                    f"({sys.argv[1] or '<none>'} -> {sys.argv[2]}). An install is pinned to that "
                    f"string, so merging this ships nothing. Bump .claude-plugin/plugin.json.")
              sys.exit(1)
          PY
          grep -qF "## $now" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $now' entry"; exit 1; }
          echo "version moved forward and changelogged"
