name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every check here is sub-second, so a superseded run has nothing to finish and
# no reason to hold a runner. Without this, three quick pushes to a PR branch
# burn three full runs to completion for one useful answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One runner, one checkout. The whole suite is well under two seconds of real
  # work, so a job per check would spend two minutes of runner time on spin-up
  # and cloning to answer in one. `if: always()` on every step after the first
  # keeps the one property a job split gives for free: a red PR reports every
  # failure it has, not just the first.
  checks:
    name: gate, shipped tooling, public-repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The repo gate — structure, frontmatter, every reference resolves
        # scripts/check.mjs is the same command a contributor runs before opening
        # a PR (.agents/worktree.json declares it as both gate and scopedCheck).
        # CI runs the contributor's own check rather than a second, drifting copy.
        run: node scripts/check.mjs

      - name: The shipped lint's own suite
        if: always()
        # vault-lint.sh ships to users and runs against their private corpus. Its
        # regressions are invisible from outside — a check that stops firing and a
        # check that was deleted look identical — so this suite is the only thing
        # standing between a silent parser change and a vault that lints clean
        # while broken.
        run: sh scripts/fixtures/run-fixtures.sh

      - name: Every shell script holds to the shell its shebang declares
        if: always()
        # bin/ runs on a user's machine, so a bashism there is a runtime failure
        # discovered at the moment of use. shellcheck reads the dialect from the
        # shebang, so this stays correct if a script ever legitimately needs bash
        # — the shebang is the contract, and this checks whatever it declares.
        run: shellcheck -S warning bin/*.sh scripts/fixtures/*.sh

      - name: Skills invoke vault-lint.sh bare, never by path
        if: always()
        # This is the invariant the scripts/ -> bin/ move exists to establish, and
        # prose alone does not hold it. A skill runs inside the USER's project
        # directory, so any path-prefixed invocation resolves against their tree
        # and fails at the moment of use — on their machine, never in CI and never
        # on the author's. bin/ is on the Bash tool's PATH; bare is the only form
        # that resolves.
        run: |
          set -eu
          if grep -rnE '/vault-lint\.sh' skills --include='*.md'; then
            echo "::error::a path-prefixed vault-lint.sh in skills/ — invoke it bare"
            exit 1
          fi
          echo "all invocations bare"

      - name: The org name and an author's home directory stay out of public skills
        if: always()
        # The skills are public and generic on purpose; the regression to catch is
        # a real username or the org name landing in one. Generic placeholders are
        # NOT that regression — `/Users/you/…` and `/Users/example/…` do real
        # explanatory work in orchestration.md and vault-migration.md, so the
        # allowlist is the placeholder WORD, anchored to the end of the path
        # segment. `/Users/dev-wynberg` fails; `/Users/you` passes. The allowlist
        # sits behind an already-matched leak, so an unanticipated placeholder
        # fails loudly on the PR that introduces it rather than passing silently.
        run: |
          set -eu
          scanned="$(find skills -name '*.md' | wc -l | tr -d '[:space:]')"
          [ "$scanned" -gt 0 ] || { echo "::error::no markdown under skills/ — this check scanned nothing"; exit 1; }
          placeholder='you|your-name|example|username|user|<[a-z-]*>'
          hits="$(grep -rnoiE 'trinity|/(Users|home)/[A-Za-z0-9._<>-]+' skills --include='*.md' \
                  | grep -viE ":/(users|home)/($placeholder)\$" || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" | sed 's/^/::error::identifier or real home path: /'
            exit 1
          fi
          echo "clean across $scanned files"

      - name: The manifest parses and carries what Claude Code needs
        if: always()
        # `claude plugin validate --strict` is the authoritative check and catches
        # things this cannot (unrecognized fields, schema drift), but it needs the
        # CLI installed. This covers the failure modes that break a published
        # plugin outright: unparseable JSON, a missing field, a `name` that does
        # not match the marketplace entry maintained in the claude-plugins repo,
        # a version the bump guard below cannot compare, and a bin/ entry
        # that lands on a user's PATH without its executable bit.
        run: |
          set -eu
          [ -x bin/vault-lint.sh ] || { echo "::error::bin/vault-lint.sh is not executable — a command-not-found mid-run"; exit 1; }
          python3 - <<'PY'
          import json, pathlib, re, sys

          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          fail = [
              f"plugin.json: missing '{field}'"
              for field in ("name", "description", "author", "version", "license", "repository")
              if not plugin.get(field)
          ]
          if plugin.get("name") != "market":
              fail.append(
                  f"plugin.json: name is '{plugin.get('name')}', but the marketplace entry "
                  "in trinity-ai-labs/claude-plugins installs 'market'"
              )
          if not re.fullmatch(r'\d+\.\d+\.\d+', str(plugin.get("version", ""))):
              fail.append(f"plugin.json: version '{plugin.get('version')}' is not MAJOR.MINOR.PATCH")
          for problem in fail:
              print(f"::error::{problem}")
          sys.exit(1 if fail else 0)
          PY

  version-bump:
    name: shipped content changed ⇒ version bumped
    # Only the merge that actually SHIPS is gated on the version. A release is
    # built on an integration branch from several slice branches, and each slice
    # changes shipped content — so without this condition every slice PR demands
    # its own bump, and one release either carries five of them or shows four red
    # PRs. The observed consequence was worse than the noise: slices stopped being
    # opened as PRs at all and were merged into the integration branch as bare
    # merge commits, which on a public repo costs the per-slice diff, the review
    # record, and `--delete-branch` — merged branches then accumulate until
    # someone prunes them by hand.
    #
    # The `checks` job above deliberately still runs on EVERY pull request: the
    # gate, shellcheck, and the public-repo hygiene scans are exactly what a slice
    # PR is for. Only the bump is deferred to the boundary where an install can
    # actually see it.
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The one job that needs history: it diffs against the PR base and reads the
      # manifest as it was at that commit.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A shipped change must move the version forward
        # plugin.json sets `version`, so an installed plugin is PINNED to that
        # string — pushing new commits under an unchanged version ships nothing
        # while looking like it worked. This is the guard for that silent failure.
        #
        # The list below is what does NOT ship, not what does. An allowlist of
        # shipped paths fails OPEN: add a commands/ or agents/ directory — the
        # obvious next step for a plugin — and it is silently exempt, which is
        # exactly the failure this job exists to catch. Inverted, a new directory
        # requires a bump by default, and new contributor tooling costs one loud
        # CI failure and a one-line exemption.
        #
        # docs/ is exempt for the same reason: a design spec ships nothing to a
        # user by itself, so it must not demand a version bump on its own. It
        # earns one only when the implementation PR it describes lands alongside
        # it and changes something that does ship.
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"
          git rev-parse --verify "$base" >/dev/null 2>&1 || { echo "no base commit to compare (first commit) — skipping"; exit 0; }
          exempt='^(scripts/|\.github/|\.agents/|AGENTS\.md|CHANGELOG\.md|docs/|\.gitignore)'
          changed="$(git diff --name-only "$base" HEAD | grep -vE "$exempt" || true)"
          if [ -z "$changed" ]; then echo "nothing shipped changed — bump not required"; exit 0; fi
          # The base commit legitimately has no manifest on the PR that introduces
          # one, and `git show` exits 128 there. Kept OUT of a pipeline and given
          # its own `|| true`: under `pipefail` a failing `git show` upstream of a
          # successful `python3` fails the whole substitution, and `set -e` then
          # kills the job with git's 128 and no output at all. Reading it into a
          # variable first makes the "no manifest yet" case explicit instead.
          read_version='import json,sys; raw=sys.stdin.read(); print(json.loads(raw).get("version","") if raw.strip() else "")'
          base_manifest="$(git show "$base:.claude-plugin/plugin.json" 2>/dev/null || true)"
          was="$(printf '%s' "$base_manifest" | python3 -c "$read_version")"
          now="$(python3 -c "$read_version" < .claude-plugin/plugin.json)"
          echo "shipped content changed:"; echo "$changed" | sed 's/^/  /'
          echo "version: ${was:-<none>} -> $now"
          # Compared as numbers, not strings: a REGRESSION (a bad merge dropping
          # 1.1.0 back to 1.0.0) is not equality, so an inequality test waves it
          # through and every install pinned at the higher version goes blind.
          python3 - "$was" "$now" <<'PY'
          import sys
          def parse(v):
              return tuple(int(p) for p in v.split(".")) if v else ()
          was, now = parse(sys.argv[1]), parse(sys.argv[2])
          if now <= was:
              print(f"::error::Shipped content changed but the version did not move forward "
                    f"({sys.argv[1] or '<none>'} -> {sys.argv[2]}). An install is pinned to that "
                    f"string, so merging this ships nothing. Bump .claude-plugin/plugin.json.")
              sys.exit(1)
          PY
          grep -qF "## $now" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $now' entry"; exit 1; }
          echo "version moved forward and changelogged"
